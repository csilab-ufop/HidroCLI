[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "HidroCLI"
version = "0.0.0"
description = "CLI to request and sync data from the ANA Hidro WebServices"
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "ctxmc", email = "git@thecortexmancer.org" }]
dependencies = ["requests", "sqlalchemy", "alembic>=1.13"]

[project.urls]
Homepage = "https://github.com/csilab-ufop/hidrocli"
Documentation = "https://github.com/csilab-ufop/hidrocli/wiki"

[project.scripts]
hidrocli     = "hidrocli.__main__:cli"
hidro-orm    = "hidro_orm.cli:main"

[project.optional-dependencies]
dev      = ["pytest", "pytest-cov"]
release  = ["python-semantic-release"]
examples = ["plotly", "geobr"]

[tool.setuptools.packages.find]
include = ["hidrocli", "hidrocli.*", "hidro_orm", "hidro_orm.*"]

[tool.setuptools.package-data]
"hidro_orm.migrations.hidro"  = ["alembic.ini", "script.py.mako"]
"hidro_orm.migrations.client" = ["alembic.ini", "script.py.mako"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
commit_parser = "conventional"
allow_zero_version = true

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix"]
parse_squash_commits = true
ignore_merge_commits = true

[tool.pytest.ini_options]
testpaths        = ["tests"]
python_files     = ["test_*.py"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["hidrocli", "hidro_orm"]
