[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "HidroCLI"
version = "0.0.0"
description = "CLI to request and sync data from the ANA Hidro WebServices"
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "ctxmc", email = "git@thecortexmancer.org" }]
dependencies = ["requests", "sqlalchemy", "alembic>=1.13", "tqdm"]

[project.urls]
Homepage = "https://github.com/csilab-ufop/hidrocli"
Documentation = "https://github.com/csilab-ufop/hidrocli/wiki"

[project.scripts]
hidrocli     = "hidrocli.__main__:cli"
hidro-orm    = "hidro_orm.cli:main"

[project.optional-dependencies]
dev      = ["pytest", "pytest-cov"]
release  = ["python-semantic-release~=10.6", "build"]
examples = ["plotly", "geobr"]

[tool.setuptools.packages.find]
include = ["hidrocli", "hidrocli.*", "hidro_orm", "hidro_orm.*"]

[tool.setuptools.package-data]
"hidro_orm.migrations.hidro"  = ["alembic.ini", "script.py.mako"]
"hidro_orm.migrations.client" = ["alembic.ini", "script.py.mako"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"
allow_zero_version = true
tag_format = "v{version}"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix"]
parse_squash_commits = true
ignore_merge_commits = true

[tool.semantic_release.changelog]
mode = "update"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.remote]
name = "origin"
type = "github"

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true

[tool.pytest.ini_options]
testpaths        = ["tests", "hidrocli_docs/tests"]
python_files     = ["test_*.py"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["hidrocli", "hidro_orm"]
