[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "HidroCLI"
version = "0.0.0"
description = "CLI to request and sync data from the ANA Hidro WebServices"
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "ctxmc", email = "git@thecortexmancer.org" }]
dependencies = ["requests", "sqlalchemy"]

[project.urls]
Homepage = "https://github.com/csilab-ufop/hidrocli"
Documentation = "https://github.com/csilab-ufop/hidrocli/wiki"

[project.scripts]
hidrocli  = "hidrocli.__main__:cli"
hidro-docs = "hidrocli_docs.docs:main"

[project.optional-dependencies]
dev      = ["pydoc-markdown", "pytest", "pytest-cov"]
release  = ["python-semantic-release"]
examples = ["plotly", "geobr"]

[tool.setuptools.packages.find]
include = ["hidrocli", "hidrocli.*", "hidrocli_docs"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
commit_parser = "conventional"
allow_zero_version = true

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix"]
parse_squash_commits = true
ignore_merge_commits = true

[tool.pytest.ini_options]
testpaths        = ["tests"]
python_files     = ["test_*.py"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["hidrocli"]

[[tool.pydoc-markdown.loaders]]
type = "python"
search_path = [ "./hidrocli" ]

[tool.pydoc-markdown.renderer]
type = "mkdocs"
output_directory = "wiki"
content_directory_name = "./"
mkdocs_config = {site_name = "HidroCLI", repo_url  = "https://github.com/ctxmc/hidrocli"}

[[tool.pydoc-markdown.renderer.pages]]
title  = "Home"
name   = "Home"
source = "README.md"

[[tool.pydoc-markdown.renderer.pages]]
title    = "Jobs"
name     = "jobs"
contents = ['jobs.*']

[[tool.pydoc-markdown.renderer.pages]]
title    = "Client Database"
name     = "client database"
contents = ['database.client.*']

[[tool.pydoc-markdown.renderer.pages]]
title    = "Hidro Database"
name     = "hidro database"
contents = ['database.hidro.*']

[[tool.pydoc-markdown.renderer.pages]]
title    = "WebServices"
name     = "webservices"
contents = ['webservices.*']

[[tool.pydoc-markdown.renderer.pages]]
title    = "Config"
name     = "config"
contents = ['config.*']

[[tool.pydoc-markdown.renderer.pages]]
title    = "Client Models"
name     = "client models"
contents = ['models.client.*']

[[tool.pydoc-markdown.renderer.pages]]
title    = "Hidro Models"
name     = "hidro models"
contents = ['models.hidro.*']